name: Offline safety tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # A legacy-runtime setup failure must not hide the other runtime's result.
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to 26.04, which has no setup-python 3.8 build.
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.11'
            os: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Motion-free dry run
        run: PYTHONPATH=src python -m fbi_door.cli dry-run
      - name: Example preflight must block
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m fbi_door.cli doctor
          result=$?
          test "$result" -eq 2
